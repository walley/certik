[package]
name = "certik"
version = "0.2.0"
edition = "2024"
description = "HTTP(S) certificate manager: TUI + HTTPS API"
license = "AGPLv3"

[dependencies]
# TUI framework (Borland Turbo Vision port)
turbo-vision = "3.0.1"

# Async runtime for the API subsystem
tokio = { version = "1", features = ["full"] }

# HTTPS API server (hyper 1.x + rustls)
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"

# Ephemeral self-signed cert for dev-mode TLS
rcgen = "0.14"

# X.509 / key decoding
openssl = { version = "0.10", features = ["vendored"] }
chrono = "0.4"
